version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qtest-postgres
    environment:
      POSTGRES_DB: qtest
      POSTGRES_USER: qtest
      POSTGRES_PASSWORD: qtest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtest -d qtest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qtest-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: qtest-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright:
    build:
      context: ./sidecar/playwright
      dockerfile: Dockerfile
    container_name: qtest-playwright
    ports:
      - "50051:50051"   # gRPC port
    environment:
      - GRPC_PORT=50051
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const grpc = require('@grpc/grpc-js'); process.exit(0);\""]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    shm_size: '2gb'  # Required for Playwright/Chrome

volumes:
  pgdata:
  redisdata:
  natsdata:
