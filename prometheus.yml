global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # QTest API server metrics
  - job_name: 'qtest-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'

  # QTest worker metrics (if running on separate port)
  - job_name: 'qtest-worker'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: '/metrics'

  # NATS monitoring
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/varz'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
