openapi: 3.0.3
info:
  title: QTest API
  description: |
    AI-Powered Test Generation Platform API.

    QTest generates comprehensive test suites using AI (Ollama LLMs).
    It parses source code, sends functions to LLMs for test specification generation,
    and converts the output to language-specific test code.

    ## Authentication

    The API supports two authentication methods:
    - **Session-based**: OAuth2 login via GitHub
    - **API Keys**: Bearer token authentication with scoped access

    API keys can be created via the web interface and have configurable scopes:
    - `repos:read` / `repos:write` - Repository access
    - `runs:read` / `runs:write` - Generation run access
    - `tests:read` / `tests:write` - Test access
    - `jobs:read` / `jobs:write` - Job access
    - `mutation:read` - Mutation testing access
  version: 1.0.0
  contact:
    name: QTest Support
    url: https://github.com/QTest-hq/qtest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.qtest.dev
    description: Production server

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Authentication endpoints
  - name: Repositories
    description: Repository management
  - name: Runs
    description: Test generation runs
  - name: Tests
    description: Generated tests
  - name: Jobs
    description: Background job management
  - name: Mutation
    description: Mutation testing
  - name: Organizations
    description: Organization management
  - name: API Keys
    description: API key management
  - name: Webhooks
    description: Webhook configuration
  - name: Usage
    description: Usage analytics
  - name: Admin
    description: Admin endpoints (requires admin role)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Simple health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Check if service is ready to handle requests
      operationId: readyCheck
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service not ready

  /auth/login:
    get:
      tags: [Auth]
      summary: Initiate OAuth login
      description: Redirects to GitHub OAuth for authentication
      operationId: login
      responses:
        '302':
          description: Redirect to GitHub OAuth

  /auth/callback:
    get:
      tags: [Auth]
      summary: OAuth callback
      description: Handles OAuth callback from GitHub
      operationId: oauthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application after successful login
        '401':
          description: Authentication failed

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Ends the user session
      operationId: logout
      responses:
        '200':
          description: Successfully logged out

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the currently authenticated user's information
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session
      description: Refresh the authentication session
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/repos:
    get:
      tags: [Auth]
      summary: List user's GitHub repos
      description: Lists repositories the user has access to on GitHub
      operationId: listUserGitHubRepos
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of GitHub repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitHubRepo'

  /api/v1/repos:
    get:
      tags: [Repositories]
      summary: List repositories
      description: Lists repositories accessible to the user
      operationId: listRepositories
      security:
        - bearerAuth: [repos:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: organization_id
          in: query
          description: Filter by organization
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
    post:
      tags: [Repositories]
      summary: Create repository
      description: Add a repository for test generation
      operationId: createRepository
      security:
        - bearerAuth: [repos:write]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/repos/{repoID}:
    get:
      tags: [Repositories]
      summary: Get repository
      description: Get details of a specific repository
      operationId: getRepository
      security:
        - bearerAuth: [repos:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Repositories]
      summary: Delete repository
      description: Delete a repository and all associated data
      operationId: deleteRepository
      security:
        - bearerAuth: [repos:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
      responses:
        '204':
          description: Repository deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/repos/{repoID}/runs:
    get:
      tags: [Runs]
      summary: List runs for repository
      description: List all test generation runs for a repository
      operationId: listRuns
      security:
        - bearerAuth: [runs:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationRun'
    post:
      tags: [Runs]
      summary: Create run
      description: Start a new test generation run
      operationId: createRun
      security:
        - bearerAuth: [runs:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'

  /api/v1/repos/{repoID}/runs/{runID}:
    get:
      tags: [Runs]
      summary: Get run
      description: Get details of a specific run
      operationId: getRun
      security:
        - bearerAuth: [runs:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
        - $ref: '#/components/parameters/RunIDParam'
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/repos/{repoID}/runs/{runID}/tests:
    get:
      tags: [Tests]
      summary: Get run tests
      description: Get all tests generated in a run
      operationId: getRunTests
      security:
        - bearerAuth: [tests:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoIDParam'
        - $ref: '#/components/parameters/RunIDParam'
      responses:
        '200':
          description: List of tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Test'

  /api/v1/tests:
    get:
      tags: [Tests]
      summary: List tests
      description: List generated tests with optional filters
      operationId: listTests
      security:
        - bearerAuth: [tests:read]
        - cookieAuth: []
      parameters:
        - name: run_id
          in: query
          description: Filter by run ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, accepted, rejected]
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Test'

  /api/v1/tests/{testID}:
    get:
      tags: [Tests]
      summary: Get test
      description: Get details of a specific test
      operationId: getTest
      security:
        - bearerAuth: [tests:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TestIDParam'
      responses:
        '200':
          description: Test details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tests/{testID}/accept:
    put:
      tags: [Tests]
      summary: Accept test
      description: Mark a test as accepted
      operationId: acceptTest
      security:
        - bearerAuth: [tests:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TestIDParam'
      responses:
        '200':
          description: Test accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tests/{testID}/reject:
    put:
      tags: [Tests]
      summary: Reject test
      description: Mark a test as rejected
      operationId: rejectTest
      security:
        - bearerAuth: [tests:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TestIDParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for rejection
      responses:
        '200':
          description: Test rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: List background jobs
      operationId: listJobs
      security:
        - bearerAuth: [jobs:read]
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
    post:
      tags: [Jobs]
      summary: Create job
      description: Create a new background job
      operationId: createJob
      security:
        - bearerAuth: [jobs:write]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /api/v1/jobs/{jobID}:
    get:
      tags: [Jobs]
      summary: Get job
      description: Get details of a specific job
      operationId: getJob
      security:
        - bearerAuth: [jobs:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIDParam'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{jobID}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel job
      description: Cancel a running or pending job
      operationId: cancelJob
      security:
        - bearerAuth: [jobs:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIDParam'
      responses:
        '200':
          description: Job cancelled
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{jobID}/retry:
    post:
      tags: [Jobs]
      summary: Retry job
      description: Retry a failed job
      operationId: retryJob
      security:
        - bearerAuth: [jobs:write]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIDParam'
      responses:
        '200':
          description: Job retried
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/pipeline:
    post:
      tags: [Jobs]
      summary: Start pipeline
      description: Start a full test generation pipeline
      operationId: startPipeline
      security:
        - bearerAuth: [jobs:write]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRequest'
      responses:
        '201':
          description: Pipeline started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /api/v1/mutation:
    get:
      tags: [Mutation]
      summary: List mutation runs
      description: List all mutation testing runs
      operationId: listMutationRuns
      security:
        - bearerAuth: [mutation:read]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of mutation runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MutationRun'
    post:
      tags: [Mutation]
      summary: Create mutation run
      description: Start a new mutation testing run
      operationId: createMutationRun
      security:
        - bearerAuth: [mutation:read]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMutationRunRequest'
      responses:
        '201':
          description: Mutation run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationRun'

  /api/v1/mutation/{mutationID}:
    get:
      tags: [Mutation]
      summary: Get mutation run
      description: Get details of a mutation testing run
      operationId: getMutationRun
      security:
        - bearerAuth: [mutation:read]
        - cookieAuth: []
      parameters:
        - name: mutationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mutation run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: List organizations the user belongs to
      operationId: listOrganizations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags: [Organizations]
      summary: Create organization
      description: Create a new organization
      operationId: createOrganization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /api/v1/organizations/{orgID}:
    get:
      tags: [Organizations]
      summary: Get organization
      operationId: getOrganization
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    patch:
      tags: [Organizations]
      summary: Update organization
      operationId: updateOrganization
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
    delete:
      tags: [Organizations]
      summary: Delete organization
      operationId: deleteOrganization
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      responses:
        '204':
          description: Organization deleted

  /api/v1/organizations/{orgID}/members:
    get:
      tags: [Organizations]
      summary: List organization members
      operationId: listOrgMembers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMember'
    post:
      tags: [Organizations]
      summary: Add organization member
      operationId: addOrgMember
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added

  /api/v1/organizations/{orgID}/members/{userID}:
    patch:
      tags: [Organizations]
      summary: Update member role
      operationId: updateMemberRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/UserIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Member role updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Organizations]
      summary: Remove member
      operationId: removeMember
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/UserIDParam'
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/audit-logs:
    get:
      tags: [Organizations]
      summary: List organization audit logs
      operationId: listOrgAuditLogs
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

  /api/v1/organizations/{orgID}/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      operationId: listWebhooks
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Create webhook
      operationId: createWebhook
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}:
    get:
      tags: [Webhooks]
      summary: Get webhook
      operationId: getWebhook
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/WebhookIDParam'
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Update webhook
      operationId: updateWebhook
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/WebhookIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      summary: Delete webhook
      operationId: deleteWebhook
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/WebhookIDParam'
      responses:
        '204':
          description: Webhook deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook deliveries
      operationId: listWebhookDeliveries
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/WebhookIDParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDelivery'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}/test:
    post:
      tags: [Webhooks]
      summary: Send test webhook
      operationId: testWebhook
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
        - $ref: '#/components/parameters/WebhookIDParam'
      responses:
        '200':
          description: Test webhook sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '404':
