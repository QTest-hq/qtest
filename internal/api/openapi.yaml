  /api/v1/organizations/{orgID}/usage/summary:
    get:
      tags: [Usage]
      summary: Get usage summary
      operationId: getUsageSummary
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIDParam'
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'

  /api/v1/organizations/{orgID}/usage/daily:
    get:
      tags: [Usage]
      summary: Get daily usage stats
      operationId: getDailyUsage
      security:
        - cookieAuth: []
