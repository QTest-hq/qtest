      description: Requires admin role
      operationId: adminListJobs
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: All jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/jobs/{jobID}/cancel:
    post:
      tags: [Admin]
      summary: Cancel any job
      description: Requires admin role
      operationId: adminCancelJob
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIDParam'
      responses:
        '200':
          description: Job cancelled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: List system audit logs
      description: Requires admin role
      operationId: adminListAuditLogs
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: System audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listAPIKeys
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
    post:
      tags: [API Keys]
      summary: Create API key
      operationId: createAPIKey
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyWithSecret'

  /api/v1/api-keys/{keyID}:
    get:
      tags: [API Keys]
      summary: Get API key
      operationId: getAPIKey
      security:
        - cookieAuth: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: revokeAPIKey
      security:
        - cookieAuth: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session-based authentication

  parameters:
    RepoIDParam:
      name: repoID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunIDParam:
      name: runID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestIDParam:
      name: testID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobIDParam:
      name: jobID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgIDParam:
      name: orgID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIDParam:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookIDParam:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [healthy, unhealthy]
        nats:
          type: string
          enum: [healthy, unhealthy]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        github_id:
          type: integer
        login:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time

    GitHubRepo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        full_name:
          type: string
        html_url:
          type: string
        private:
          type: boolean
        default_branch:
          type: string

    Repository:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        name:
          type: string
        owner:
          type: string
        default_branch:
          type: string
        status:
          type: string
          enum: [pending, cloning, ready, failed]
        last_commit_sha:
          type: string
        organization_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRepositoryRequest:
      type: object
      properties:
        url:
          type: string
          description: GitHub repository URL
        branch:
          type: string
          description: Branch to clone (default main)
        organization_id:
          type: string
          format: uuid
          description: Organization to add repo to
      required:
        - url

    GenerationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        tests_generated:
          type: integer
        tests_accepted:
          type: integer
        config:
          type: object
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateRunRequest:
      type: object
      properties:
        tier:
          type: integer
          minimum: 1
          maximum: 3
          description: LLM tier (1=fast, 2=balanced, 3=thorough)
        max_tests:
          type: integer
          minimum: 1
          description: Maximum tests to generate
        config:
          type: object
          description: Additional configuration

    Test:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        function_name:
          type: string
        test_name:
          type: string
        test_code:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected]
        rejection_reason:
          type: string
        file_path:
          type: string
        created_at:
          type: string
          format: date-time

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [generate, validate, commit]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        repository_id:
          type: string
          format: uuid
        payload:
          type: object
        result:
          type: object
        error:
          type: string
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    CreateJobRequest:
      type: object
      properties:
        type:
          type: string
          enum: [generate, validate, commit]
        repository_id:
          type: string
          format: uuid
        payload:
          type: object
      required:
        - type
        - repository_id

    PipelineRequest:
      type: object
      properties:
        repository_id:
          type: string
          format: uuid
        tier:
          type: integer
        max_tests:
          type: integer
        create_pr:
          type: boolean
      required:
        - repository_id

    MutationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        status:
          type: string
        total_mutants:
          type: integer
        killed_mutants:
          type: integer
        survived_mutants:
          type: integer
        mutation_score:
          type: number
        created_at:
          type: string
          format: date-time

    CreateMutationRunRequest:
      type: object
      properties:
        repository_id:
          type: string
          format: uuid
        files:
          type: array
          items:
            type: string
      required:
        - repository_id

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_personal:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required:
        - name
        - slug

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string

    OrgMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        user:
          $ref: '#/components/schemas/User'

    AddMemberRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member]
      required:
        - user_id
        - role

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 8 characters of the key
        scopes:
          type: array
          items:
            type: string
        organization_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    APIKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            key:
              type: string
              description: Full API key (only shown once)

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - repos:read
              - repos:write
              - runs:read
              - runs:write
              - tests:read
              - tests:write
              - jobs:read
              - jobs:write
              - mutation:read
        organization_id:
          type: string
          format: uuid
        expires_in_days:
          type: integer
      required:
        - name
        - scopes

    UpdateMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member]
      required:
        - role

    UpdateUserRequest:
      type: object
      properties:
        is_active:
          type: boolean
        role:
          type: string
          enum: [user, admin]

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        action:
          type: string
          description: Action performed (e.g., "repo.create", "test.accept")
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: object
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - run.started
              - run.completed
              - run.failed
              - test.generated
              - test.accepted
              - test.rejected
              - job.completed
              - job.failed
        is_active:
          type: boolean
        description:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        description:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
      required:
        - name
        - url
        - events

    UpdateWebhookRequest:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        description:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event:
          type: string
        payload:
          type: object
        response_status:
          type: integer
        response_body:
          type: string
        success:
          type: boolean
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time

    UsageSummary:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        total_runs:
          type: integer
        total_tests:
          type: integer
        total_api_calls:
          type: integer
        total_llm_tokens:
          type: integer
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time

    DailyUsage:
      type: object
      properties:
        date:
          type: string
          format: date
        runs:
          type: integer
        tests:
          type: integer
        api_calls:
          type: integer
        llm_tokens:
          type: integer

    MonthlyUsage:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format"
        runs:
          type: integer
        tests:
          type: integer
        api_calls:
          type: integer
        llm_tokens:
          type: integer

    UsageEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        tokens_used:
          type: integer
        created_at:
          type: string
          format: date-time

    EndpointUsage:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
        call_count:
          type: integer
        avg_response_time_ms:
          type: number
        error_count:
          type: integer

    SystemStats:
      type: object
      properties:
        total_users:
          type: integer
        total_organizations:
          type: integer
        total_repositories:
          type: integer
        total_runs:
          type: integer
        total_tests:
          type: integer
        active_jobs:
          type: integer
        pending_jobs:
          type: integer
        failed_jobs_24h:
          type: integer
        llm_tokens_24h:
          type: integer
        api_calls_24h:
          type: integer
